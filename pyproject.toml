[project]
name = "pitcrew-cc"
version = "0.2.0"
description = "Verifica herramientas, renderiza un plan y lo aplica para configurar Claude Code."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]

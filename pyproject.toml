[project]
name = "setup-architect"
version = "0.1.0"
description = "Verifica herramientas, renderiza un plan y lo aplica para configurar Claude Code."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
